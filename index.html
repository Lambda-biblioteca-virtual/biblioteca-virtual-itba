<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f2e7">
  <title>Lambda | Biblioteca Virtual ITBA</title>
  <link rel="stylesheet" href="library.css">
  <link rel="stylesheet" href="lambda.css">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#inicio" aria-label="Lambda, biblioteca virtual ITBA, inicio"><span class="brand-line"><b class="brand-symbol">λ</b><strong>Lambda</strong></span><span class="brand-university">ITBA</span><span class="brand-description">Biblioteca virtual</span></a>
    <nav aria-label="Navegación principal">
      <a href="#inicio" data-view="inicio"><i data-lucide="house"></i><span>Inicio</span></a>
      <a href="#buscar" data-view="buscar"><i data-lucide="search"></i><span>Buscar</span></a>
      <a href="#descargas" data-view="descargas"><i data-lucide="download"></i><span>Descargas</span></a>
      <a href="#guardados" data-view="guardados"><i data-lucide="bookmark"></i><span>Guardados</span><small id="saved-count">0</small></a>
    </nav>
    <div class="sidebar-bottom"><a href="admin.html"><i data-lucide="settings-2"></i><span>Administrar</span></a><p>Hecha para compartir.<br>Y seguir aprendiendo.</p></div>
  </aside>
  <div class="workspace">
    <header class="topbar"><span>Lambda <strong>Biblioteca Virtual ITBA</strong></span></header>
    <main>
      <div class="page-heading" id="page-heading"><div><p class="eyebrow" id="eyebrow">TU ESPACIO DE ESTUDIO</p><h1 id="page-title">Lambda</h1></div><span class="heading-mark" aria-hidden="true"><i data-lucide="book-open"></i></span></div>
      <form id="search-form" role="search">
        <div class="search-line"><i data-lucide="search"></i><input id="query" type="search" aria-label="Buscar material" placeholder="Buscar por título, materia o tema…"><button class="primary" type="submit">Buscar <i data-lucide="arrow-right"></i></button></div>
        <div class="filters">
          <label>Carrera<select id="career"></select></label>
          <label>Año<select id="year"></select></label>
          <label>Cuatrimestre<select id="term"></select></label>
          <label>Materia<select id="subject"></select></label>
          <button class="icon-button reset" type="reset" title="Limpiar filtros" aria-label="Limpiar filtros"><i data-lucide="rotate-ccw"></i></button>
        </div>
      </form>
      <nav id="categories" class="categories" aria-label="Tipo de material"></nav>
      <div id="library-content" aria-live="polite"></div>
      <footer>Lambda · Biblioteca Virtual ITBA <span>Proyecto estudiantil independiente</span></footer>
    </main>
  </div>
  <dialog id="detail" aria-labelledby="detail-title"><div id="detail-body"></div></dialog>
  <p id="toast" role="status" hidden></p>
  <script src="lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="data.js"></script>
  <script src="app.js?v=supabase-1"></script>
