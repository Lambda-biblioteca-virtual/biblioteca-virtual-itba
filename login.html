<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f2e7">
  <meta name="referrer" content="no-referrer">
  <title>Ingresar | Lambda</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="library.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">
  <main class="auth-main">
    <a class="auth-brand" href="login.html" aria-label="Lambda, biblioteca virtual ITBA">
      <span class="auth-brand-line"><b>λ</b><strong>Lambda</strong></span>
      <span class="auth-university">ITBA</span><span class="auth-caption">Biblioteca virtual</span>
    </a>
    <section class="auth-panel google-panel" aria-labelledby="auth-title">
      <h1 id="auth-title">Tu biblioteca te espera.</h1>
      <p id="auth-description">Ingresá con tu cuenta del ITBA.</p>
      <button class="google-button" id="google-login" type="button" disabled>Continuar con Google</button>
      <p class="auth-domain">@itba.edu.ar</p>
      <p id="auth-message" role="status" aria-live="polite" hidden></p>
      <noscript>Activá JavaScript para iniciar sesión.</noscript>
    </section>
    <p class="auth-footer">Lambda · Un lugar para seguir aprendiendo.</p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="auth.js?v=google-1"></script>
</body>
</html>
